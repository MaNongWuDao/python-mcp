[project]
name = "mcp-code-examples"
version = "0.1.0"
description = "Runnable MCP Python SDK examples covering tools, resources, prompts, LangChain/LangGraph, and transports."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "mcp==2.2.0",
    "pydantic>=2.0",
]

[tool.uv]
package = false
